name: golem-sticker-capabilities
version: 1.16.0
description: "Golem-managed global WeChat sticker collection/inventory/search, lazy image-vision, and video tools plus safe background URL video delivery."
author: Golem
kind: standalone
requires_env:
  - name: GOLEM_CAPABILITIES_TOKEN
    description: "Bearer token shared only by Hermes Gateway and the local Golem capability API"
    prompt: "Golem capability token"
    password: true
optional_env:
  - name: GOLEM_ASYNC_DELIVERY_ENABLED
    description: "Enable durable delivery for Hermes v0.18.2 background delegations and cron jobs (default: false)"
    prompt: "Enable durable async and cron delivery"
    password: false
  - name: GOLEM_STICKER_INSPECT_ENABLED
    description: "Register the optional auxiliary-vision sticker inspection tool (default: true)"
    prompt: "Enable sticker vision inspection"
    password: false
  - name: GOLEM_VIDEO_ENABLED
    description: "Expose Golem video tools when the Hermes Relay video capability is enabled (default: false)"
    prompt: "Enable video tools"
    password: false
  - name: GOLEM_VIDEO_PREPARE_TIMEOUT_SECONDS
    description: "Maximum time for a video select tool to poll preparation status (default: 210, maximum: 600)"
    prompt: "Video preparation timeout seconds"
    password: false
provides_tools:
  - golem_sticker_search
  - golem_sticker_library_inventory
  - golem_sticker_library_preview
  - golem_sticker_library_pick
  - golem_sticker_library_search
  - golem_sticker_collect_current_session
  - golem_sticker_library_manage_recent
  - golem_silence_rule_add
  - golem_sticker_inspect
  - golem_sticker_attach
  - golem_sticker_select
  - golem_sticker_select_many
  - golem_image_search_current_session
  - golem_image_inspect_current_session
  - golem_image_read_current_session
  - golem_video_search
  - golem_video_attach
  - golem_video_select
  - golem_video_fetch
